
[program:cross-posting-tg]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/html/cross_posting
command=/usr/bin/php artisan queue:work --queue=tg --sleep=3 --tries=3 --timeout=1800 --memory=256
numprocs=2
autostart=true
autorestart=true
startsecs=5
startretries=10
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/cross_posting/storage/logs/worker-tg.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopasgroup=true
killasgroup=true
stopwaitsecs=1900

